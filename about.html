<main id='main-content">
  <section class="assignment-card">
   <div class="question-meta">
     <span class="question-badge">Q1</span>
     <span class=question-type">Open response</span>
  </div>
 <section="contact-section">
   <h1>Contact Me<h1>
    <form id"contact-form" novalidate>
  
<!-- Fieldset & Legend group related inputs (Gestalt: Enclosure& Proximity)-->
  <fieldset class="form-group">
    <legend>Your Contact Information</legend>

    <div class="input-wrapper">
      <label for"full name">Full Name <span aria-hidden="true">*</span></label>
      <input
        type="text"
        id="full-name"
        name="full-name"
        required
        aria-required="true"
        aria-descibedby="name-error"
       />
  <!-- Accessible error message linked via aria-describedby -->
  <span id="name-error" class="error-message" role="alert" aria-live="polite"></span>
  </div>

  <div class="input-wrapper">
    <label for="email">Email Address </span aria-hidden="true">
    <input>
     type="email"
     id="email"
     name="email"
     required
     aria-required="true"
     aria-describedby="email-error"
    />
    <span id=email-error" class="error message" role="alert" aria-live="polite"></span>
  </div>
</fieldset>

<fieldset class="form-group">
  <legend>Message Details</legend>

<div class="input-wrapper">
  <label for="message">Your Message<span aria-hidden="true">*</span><label>
  <textarea
     id="message"
     name="message"
     rows="5"
     required
     aria-required="true"
     aria-describedby="message-error"
   ></textarea>
   <span id="message-error" class="error-message" role="alert" aria-live="polite"></span>
  </div>
  </fieldset>

  <button type="submit" class="btn-primary">end Message</button>
</form>
  </section>
  </main>
  <p class=intro-text">
    Apply CSS to your Milestone 1 skeleton andmake it fully responsive. Three deliverables:
  </p>

  <div class="deliverable">
    <div class="deliverable-group">
      <h2>1. Styling</h2>
      <ul>
       <li>A linked CSS file applying yourplanned color paletteand a <strong>Google Font pairing</strong> across all page</li>
       <li>At least <strong>three selector types</strong> used (type, class, ID)</li>
       <liA consistent spacing system (aim for multiples of 8xp)</li>
  </ul>
</div>

<div class="deliverable-group">
  <h2>2. Layout</h2>
  <ul>
    <li><strong>Flexbox or Grid</strong> used for at least one multi-column section</li>
  <li>All pages must be visually organized&mdash; no unstyleddefault browser output</li>
  </ul>
</div>

<div class="deliverable-group">
  <h2>3. Responsiveness</h2>
  <ul>
    <li>Site must work at <strong.320px 9mobile)</strong>, <strong>768px (tablet)</strong>, and <strong>1200px (desktop)</strong>,/li>
    <li>At least <strong>two</strong> <code@media</code> <strong>queries</strong> present</li>
    <li>Test with DevTools device emulation</li>
  </ul>
</div>
</div>

<p class="submission-note">
  Submit your updated <strong>GitHub repo URL</strong>. Your site must be live on GitHub Pages.
  </p>

  <details class="rubric-toggle">
    <summary>View grading rubruc</summary>
    <p>Grading criteria details go here.</p>
  <details>

  <form class="response-form">
   <label for="repo-response" class="sr-only">Your response</label>
   <textarea id="repo-reponse" rows"3">&lt;gh;repo clone Checks-Balances67/Project-1-Milestone&gt;</texarea>
  </form>
  </section>
  </main>
</body>
